name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RdpDrop.sln

      - name: Build
        run: dotnet build RdpDrop.sln -c Release --no-restore

      - name: Test
        run: dotnet test RdpDrop.sln -c Release --no-build --logger trx

name: Release

# A tag v* builds, signs and publishes a release. A manual run builds and signs only,
# and keeps the signed executables as workflow artifacts, to test the signing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) {
            Write-Error "Release notes file $notes is missing. Add it before tagging."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UltimateRDP.sln

      - name: Build
        run: dotnet build UltimateRDP.sln -c Release --no-restore

      - name: Test
        run: dotnet test UltimateRDP.sln -c Release --no-build --logger trx

      - name: Publish client
        run: dotnet publish src/UltimateRDP.Client/UltimateRDP.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o artifacts/UltimateRDP

      - name: Publish agent
        run: dotnet publish src/UltimateRDP.Agent/UltimateRDP.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o artifacts/UltimateRDP.Agent

      - name: Keep only the executables
        shell: pwsh
        run: |
          foreach ($folder in 'artifacts/UltimateRDP', 'artifacts/UltimateRDP.Agent') {
            Get-ChildItem -Path $folder -Exclude *.exe | Remove-Item -Recurse -Force
            $files = @(Get-ChildItem -Path $folder -Recurse -File)
            if ($files.Count -ne 1) {
              Write-Error "$folder must hold exactly one file, found $($files.Count): $($files.Name -join ', ')"
              exit 1
            }
            Write-Host "$folder holds $($files[0].Name) ($($files[0].Length) bytes)"
          }

      - name: Upload unsigned executables
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  # The only job that sees the signing secrets. It signs the two executables with the
  # APROGSYS certificate through Azure Artifact Signing, then checks each signature.
  sign:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: artifacts

      - name: Sign the executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: APROGSYS
          certificate-profile-name: APROGSYS-PublicTrust
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error 'signtool.exe not found on the runner'; exit 1 }
          Write-Host "Using $signtool"
          $failed = $false
          foreach ($file in Get-ChildItem artifacts -Recurse -Filter *.exe) {
            & $signtool verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "Signature check failed for $($file.Name)"; $failed = $true }
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status), signer $($sig.SignerCertificate.Subject), timestamp $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=APROGSYS' -or -not $sig.TimeStamperCertificate) {
              Write-Error "$($file.Name) is not validly signed by APROGSYS with a timestamp"; $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Upload signed executables
        uses: actions/upload-artifact@v4
        with:
          name: signed
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: artifacts

      - name: Zip
        shell: pwsh
        run: |
          foreach ($folder in 'artifacts/UltimateRDP', 'artifacts/UltimateRDP.Agent') {
            $files = @(Get-ChildItem -Path $folder -Recurse -File)
            if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
              Write-Error "$folder must hold exactly one executable"
              exit 1
            }
          }
          Compress-Archive -Path artifacts/UltimateRDP/* -DestinationPath "UltimateRDP-$env:TAG-win-x64.zip"
          Compress-Archive -Path artifacts/UltimateRDP.Agent/* -DestinationPath "UltimateRDP.Agent-$env:TAG-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            UltimateRDP-${{ github.ref_name }}-win-x64.zip
            UltimateRDP.Agent-${{ github.ref_name }}-win-x64.zip
          fail_on_unmatched_files: true
